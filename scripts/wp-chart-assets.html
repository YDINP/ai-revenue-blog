      var ACCENT=el.dataset.accent||'#3b82f6', MUTE='#94a3b8', html='';
      if(title)html+='<div class="chart-title">'+title+'</div>';
      html+=vertical?'<div class="chart-columns">':'<div class="chart-bars">';
      labels.forEach(function(label,i){
        var pct=max>0?(values[i]/max)*100:0;
        var color=hlIdx>=0?(i===hlIdx?ACCENT:MUTE):colors[i%colors.length].trim();
        if(vertical){
          var gradV='linear-gradient(0deg, '+color+', '+hexToRgba(color,0.7)+')';
          var d=vMax>0?Math.round(((values[i]-vMax)/vMax)*100):0;
          var delta=(values.length===2&&values[i]!==vMax&&d!==0)?' <span class="chart-delta">'+d+'%</span>':'';
          html+='<div class="chart-col"><span class="chart-value">'+values[i]+unit+delta+'</span><div class="chart-col-track"><div class="chart-col-fill" style="height:'+pct+'%;background:'+gradV+'"></div></div><span class="chart-col-label">'+label.trim()+'</span></div>';
          return;
        }
        var grad='linear-gradient(90deg, '+color+', '+hexToRgba(color,0.7)+')';
        html+='<div class="chart-row"><span class="chart-label">'+label.trim()+'</span><div class="chart-track"><div class="chart-fill" style="width:'+pct+'%;background:'+grad+'"></div></div><span class="chart-value">'+values[i]+unit+'</span></div>';
      });
      html+='</div>'; el.innerHTML=html; chartObserver.observe(el);
    });

    // 2) radar
    document.querySelectorAll('.chart-radar').forEach(function(el){
      var items=JSON.parse(el.dataset.items||'[]'), title=el.dataset.title||'', html='';
      if(title)html+='<div class="chart-title">'+title+'</div>';
      html+='<div class="chart-radar-grid">';
      var allVals=items.flatMap(function(it){return (it.scores||[]).map(function(s){return Number(s.value)||0;});});
      var rawMax=Math.max.apply(null,allVals.concat([1]));
      var scaleMax=rawMax<=10?10:(rawMax<=100?100:Math.ceil(rawMax/50)*50);
      items.forEach(function(item){
        var scores=item.scores||[];
        var avg=scores.length>0?(scores.reduce(function(a,s){return a+s.value;},0)/scores.length).toFixed(1):'0';
        var mainColor=(scores[0]&&scores[0].color)||'#3b82f6';
        html+='<div class="radar-item"><div class="radar-item-accent" style="background:'+mainColor+'"></div><div class="radar-name" style="color:'+mainColor+'">'+item.name+'</div><div class="radar-avg"><span class="radar-avg-badge" style="background:'+hexToRgba(mainColor,0.12)+';color:'+mainColor+'">평균 '+avg+'/'+scaleMax+'</span></div><div class="radar-scores">';
        scores.forEach(function(s){
          var pct=Math.min((s.value/scaleMax)*100,100), col=s.color||'#3b82f6';
          var grad='linear-gradient(90deg, '+col+', '+hexToRgba(col,0.6)+')';
          html+='<div class="radar-score-row"><span class="radar-score-label">'+s.label+'</span><div class="radar-score-track"><div class="radar-score-fill" style="width:'+pct+'%;background:'+grad+'"></div></div><span class="radar-score-val" style="color:'+col+'">'+s.value+'</span></div>';
        });
        html+='</div></div>';
      });
      html+='</div>'; el.innerHTML=html; chartObserver.observe(el);
    });

    // 3) donut
    document.querySelectorAll('.chart-donut').forEach(function(el){
      var labels=(el.dataset.labels||'').split(','), values=(el.dataset.values||'').split(',').map(Number);
      var colors=(el.dataset.colors||'#3b82f6,#009e73,#f59e0b,#d55e00,#8b5cf6').split(',');
      var title=el.dataset.title||'', unit=el.dataset.unit||'', total=values.reduce(function(a,v){return a+v;},0);
      var gradient='', cumPct=0;
      values.forEach(function(v,i){var pct=total>0?(v/total)*100:0, color=colors[i%colors.length].trim();
        gradient+=color+' '+cumPct+'% '+(cumPct+pct)+'%'; cumPct+=pct; if(i<values.length-1)gradient+=', ';});
      var percentOnly=el.dataset.valueMode==='percent', topIdx=0;
      values.forEach(function(v,i){if(v>values[topIdx])topIdx=i;});
      var topPct=total>0?((values[topIdx]/total)*100).toFixed(1):'0', html='';
      if(title)html+='<div class="chart-title">'+title+'</div>';
      html+='<div class="chart-donut-container"><div class="donut-ring" style="background:conic-gradient('+gradient+')">';
      html+=percentOnly?'<div class="donut-hole"><span class="donut-total">'+topPct+'%</span><span class="donut-total-label">'+labels[topIdx].trim()+'</span></div>':'<div class="donut-hole"><span class="donut-total">'+total+unit+'</span><span class="donut-total-label">합계</span></div>';
      html+='</div><div class="donut-legend">';
      labels.forEach(function(label,i){
        var pct=total>0?((values[i]/total)*100).toFixed(1):'0';
        var valText=percentOnly?pct+'%':values[i]+unit+' ('+pct+'%)';
        html+='<div class="donut-legend-item"><span class="donut-legend-dot" style="background:'+colors[i%colors.length].trim()+'"></span><span class="donut-legend-label">'+label.trim()+'</span><span class="donut-legend-value">'+valText+'</span></div>';
      });
      html+='</div></div>'; el.innerHTML=html;
    });

    // 4) versus
    document.querySelectorAll('.chart-versus').forEach(function(el){
      var items=JSON.parse(el.dataset.items||'[]'), title=el.dataset.title||'';
      var nameA=el.dataset.nameA||'A', nameB=el.dataset.nameB||'B', colorA=el.dataset.colorA||'#3b82f6', colorB=el.dataset.colorB||'#009e73';
      var maxVal=Math.max.apply(null,items.flatMap(function(i){return [i.a,i.b];}))*1.1, html='';
      if(title)html+='<div class="chart-title">'+title+'</div>';
      html+='<div class="versus-header"><span class="versus-name" style="color:'+colorA+'">'+nameA+'</span><span class="versus-vs">VS</span><span class="versus-name" style="color:'+colorB+'">'+nameB+'</span></div><div class="versus-rows">';
      items.forEach(function(item){
        var pctA=maxVal>0?(item.a/maxVal)*100:0, pctB=maxVal>0?(item.b/maxVal)*100:0, aWin=item.a>item.b, bWin=item.b>item.a;
        html+='<div class="versus-row"><div class="versus-bar-left"><span class="versus-val'+(aWin?' versus-win':'')+'">'+item.a+'</span><div class="versus-track versus-track-left"><div class="versus-fill'+(aWin?' win':'')+'" style="width:'+pctA+'%;background:linear-gradient(270deg, '+colorA+', '+hexToRgba(colorA,0.6)+')"></div></div></div><div class="versus-label">'+item.label+'</div><div class="versus-bar-right"><div class="versus-track"><div class="versus-fill'+(bWin?' win':'')+'" style="width:'+pctB+'%;background:linear-gradient(90deg, '+colorB+', '+hexToRgba(colorB,0.6)+')"></div></div><span class="versus-val'+(bWin?' versus-win':'')+'">'+item.b+'</span></div></div>';
      });
      html+='</div>'; el.innerHTML=html; chartObserver.observe(el);
    });

    // 5) progress
    document.querySelectorAll('.chart-progress').forEach(function(el){
      var labels=(el.dataset.labels||'').split(','), values=(el.dataset.values||'').split(',').map(Number);
      var colors=(el.dataset.colors||'#3b82f6,#009e73,#f59e0b,#d55e00,#8b5cf6').split(',');
      var title=el.dataset.title||'', max=Number(el.dataset.max||'100'), unit=el.dataset.unit||'', circ=2*Math.PI*45, html='';
      if(title)html+='<div class="chart-title">'+title+'</div>';
      html+='<div class="progress-grid">';
      labels.forEach(function(label,i){
        var pct=Math.min(values[i]/max,1), offset=circ-(circ*pct), color=colors[i%colors.length].trim();
        html+='<div class="progress-item"><div class="progress-circle"><svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="45" /><circle class="progress-ring" cx="50" cy="50" r="45" style="stroke:'+color+';stroke-dasharray:'+circ+';stroke-dashoffset:'+circ+'" data-target="'+offset+'" /></svg><div class="progress-value" style="color:'+color+'">'+values[i]+unit+'</div></div><div class="progress-label">'+label.trim()+'</div></div>';
      });
      html+='</div>'; el.innerHTML=html; chartObserver.observe(el);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run); else run();
})();

</script>
