name: Threads Replies (15분 주기 댓글 수집·자동 대댓글)

# 왜 별도 워크플로인가: threads-cron.yml 은 하루 2번(23:00/01:00 KST)이라 댓글 알림이 최대
# 24시간 늦었다. Threads는 댓글이 노출 신호의 핵심인데 하루 늦은 답글은 대화가 이미 식는다.
# 발행/인사이트는 하루 2번으로 충분하니 댓글만 떼서 15분 주기로 돌린다(only=replies).
#
# 비용: 이 레포는 PUBLIC → GitHub Actions 분 무료·무제한.
# Vercel Hobby 크론은 하루 1회 단위라 이 주기를 낼 수 없다(그래서 GH Actions).
# Hobby 서버리스 함수 12/12 만석이라 답글 전용 엔드포인트도 못 만든다(그래서 ?only=replies).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 앞 실행이 밀렸을 때 겹쳐 돌면 같은 댓글을 두 번 처리할 수 있다(comment_id unique로 막히지만
# API 호출은 낭비) → 동시 실행을 막는다.
concurrency:
  group: threads-replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    steps:
      - name: Call threads-cron (replies only)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://ai-revenue-blog.vercel.app
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/threads-cron?only=replies")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          # 조용히 죽는 게 제일 나쁘다 — 200 아니면 워크플로를 실패시켜 알림을 받는다.
          test "$code" = "200"
