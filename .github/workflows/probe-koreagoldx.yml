name: probe-koreagoldx (임시 진단)

# 한국금거래소가 해외/데이터센터 IP를 403 으로 막는다(Vercel iad1·r.jina.ai 확인).
# GitHub Actions 러너(Azure)에서 통과하는지만 확인하는 일회성 워크플로 — 확인 후 삭제한다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl koreagoldx /api/main
        run: |
          echo "--- egress IP ---"
          curl -s https://ipinfo.io/json | head -c 300; echo
          echo "--- koreagoldx ---"
          code=$(curl -s -o body.txt -w '%{http_code}' -m 25 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
            -H 'Accept: application/json' -H 'Referer: https://www.koreagoldx.co.kr/' \
            https://www.koreagoldx.co.kr/api/main)
          echo "status=$code"
          head -c 300 body.txt; echo
