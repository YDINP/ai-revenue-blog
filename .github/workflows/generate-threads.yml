# ⚠️ 이 워크플로는 **동작하지 않는다.** 2026-07-14 이후 실행할 때마다
#    `claude 401: invalid x-api-key` 로 실패했다 — GitHub secrets 의 ANTHROPIC_API_KEY 가 무효다.
#    실패한 채로 방치되면서 큐가 말라 2026-08-03 발행분이 비었다.
#
#    이 프로젝트는 같은 이유로 블로그 발행 LLM 과 대댓글 초안을 이미 로컬 claude CLI 로 옮겼다.
#    발행 초안도 로컬 러너로 대체한다:
#
#        node automation/threads-gen-run.mjs --count 3 --schedule
#
#    유효한 ANTHROPIC_API_KEY 를 secrets 에 넣으면 이 워크플로를 다시 살릴 수 있다.
#    그때까지는 수동 실행해도 실패만 하므로 **켜 두지 않는다**(조용한 실패가 제일 나쁘다).

name: Threads Draft Generator

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: '계정 ID (비우면 topic 매칭)'
        required: false
        default: ''
        type: string
      topic:
        description: '주제'
        required: false
        default: 'life'
        type: choice
        options: [life, ai, game, coupang]
      count:
        description: '생성 개수'
        required: false
        default: '2'
        type: choice
        options: ['1', '2', '3', '5']
      linkmode:
        description: '유도 링크'
        required: false
        default: 'blog'
        type: choice
        options: [blog, coupang]

jobs:
  generate-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Threads drafts
        run: node scripts/generate-threads.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_ACCOUNT_ID: ${{ github.event.inputs.account_id || '' }}
          INPUT_TOPIC: ${{ github.event.inputs.topic || 'life' }}
          INPUT_COUNT: ${{ github.event.inputs.count || '2' }}
          INPUT_LINKMODE: ${{ github.event.inputs.linkmode || 'blog' }}
