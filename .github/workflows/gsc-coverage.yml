name: GSC Coverage (색인 커버리지 수집)

# 구글 색인 커버리지 스냅샷을 gsc_coverage 에 쌓는다(daily-report 의 📈 SEO 추이 블록이 읽음).
# Vercel cron 은 Hobby 플랜 크론 수 제한(1개)에 걸려 daily-report 하나만 쓸 수 있어,
# 이 수집은 GitHub Actions schedule 로 돌린다. daily-report(Vercel cron 23:00 UTC)보다
# 먼저 끝나도록 22:30 UTC(07:30 KST)에 잡는다 — GH schedule 지연이 있어도 대개 그 전에 돈다.
# (지연으로 늦어도 리포트는 '직전 스냅샷'을 보여줄 뿐이라 추이는 유지된다. 스냅샷 날짜를 함께 표기.)
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger coverage scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://ai-revenue-blog.vercel.app/api/gsc-sync?coverage=run"
          echo "GET $URL"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 90 "$URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "status=$code"
          cat /tmp/out.json
          echo
          [ "$code" = "200" ] || exit 1
