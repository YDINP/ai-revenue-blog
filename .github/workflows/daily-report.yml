name: Daily Report (Telegram)

# 매일 09:00 KST 전날 종합 리포트를 텔레그램 봇으로 발송.
# Vercel Hobby 플랜의 cron 은 지정 시각에서 최대 1시간까지 지연돼 09시 발송이 보장되지
# 않아 GitHub Actions 스케줄로 옮겼다 (vercel.json 의 crons 는 중복 발송 방지를 위해 제거).
on:
  schedule:
    - cron: '0 0 * * *'      # UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      day:
        description: '집계 날짜 (YYYY-MM-DD, 비우면 어제)'
        required: false
        default: ''
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAY: ${{ inputs.day }}
        run: |
          URL="https://ai-revenue-blog.vercel.app/api/daily-report"
          if [ -n "$DAY" ]; then URL="$URL?day=$DAY"; fi
          echo "POST $URL"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "status=$code"
          cat /tmp/out.json
          echo
          [ "$code" = "200" ] || exit 1
