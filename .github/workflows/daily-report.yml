name: Daily Report (Telegram)

# 전날 종합 리포트를 텔레그램 봇으로 발송하는 수동 트리거.
# 정기 발송은 vercel.json 의 cron('0 23 * * *' = 08:00 KST)이 담당한다.
# GitHub Actions 의 schedule('0 0 * * *')은 UTC 00:00(전 세계 크론 최혼잡 시각)이라
# 관측상 2.5~4h 지연돼 09시 발송이 불가능했다. 중복 발송 방지를 위해 schedule 제거,
# 특정 날짜 재발송/수동 확인용으로 workflow_dispatch 만 남긴다.
on:
  workflow_dispatch:
    inputs:
      day:
        description: '집계 날짜 (YYYY-MM-DD, 비우면 어제)'
        required: false
        default: ''
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAY: ${{ inputs.day }}
        run: |
          URL="https://ai-revenue-blog.vercel.app/api/daily-report"
          if [ -n "$DAY" ]; then URL="$URL?day=$DAY"; fi
          echo "POST $URL"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "status=$code"
          cat /tmp/out.json
          echo
          [ "$code" = "200" ] || exit 1
