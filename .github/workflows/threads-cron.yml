name: Threads Cron (예약발행 · 인사이트 · 댓글수집)

# Vercel Hobby 크론은 지정 시각에서 최대 1시간 지연되고 실제로 안 뜨는 날도 있다.
# 2026-07-23~28 사이 자동발행이 5일간 멈춘 정황이 있어(초안 10건이 auto 모드로 대기 중이었음)
# daily-report 와 같은 이유로 GH Actions 로 옮긴다. vercel.json 의 crons 에서는 제거했다.
#
# 22:00 KST 에 예약이 도래하도록 큐를 잡아두므로 23:00 KST 한 번이면 충분하지만,
# GH Actions cron 도 지연되므로 여유를 두고 두 번 친다(중복 발행은 status 전이로 방지됨).
on:
  schedule:
    # ⚠️ GitHub 무료 스케줄러는 부하가 걸리면 예약 실행을 **지연하거나 통째로 버린다.**
    #    2026-08-03 밤 14:00·16:00 UTC 두 번이 연속으로 건너뛰어져 예약글 #20(8/3 22:00 KST)이
    #    발행되지 못한 채 지나갔다. 보조 슬롯 하나로는 부족했다.
    #    → 골든슬롯(KST 08:00/23:00) 전후로 촘촘히 깔아 하나라도 걸리게 한다.
    #    엔드포인트는 멱등이다: scheduled_at <= now 인 것만 발행하고, 자동발행은
    #    AUTO_DAILY_CAP(publishedCount24h)로 막히므로 자주 돌아도 중복 발행되지 않는다.
    - cron: '0 13 * * *'   # 22:00 KST
    - cron: '0 14 * * *'   # 23:00 KST ← 골든슬롯
    - cron: '30 14 * * *'  # 23:30 KST
    - cron: '0 16 * * *'   # 01:00 KST
    - cron: '0 22 * * *'   # 07:00 KST
    - cron: '0 23 * * *'   # 08:00 KST ← 골든슬롯
    - cron: '30 23 * * *'  # 08:30 KST
    - cron: '0 1 * * *'    # 10:00 KST — 아침 슬롯이 통째로 밀렸을 때의 마지막 보조
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call threads-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://ai-revenue-blog.vercel.app
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/threads-cron")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          # 200 이 아니면 워크플로를 실패시켜 GitHub 알림을 받는다(조용히 죽는 게 제일 나쁘다)
          test "$code" = "200"
